<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNA &amp; Ethik Quiz</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f0f7f5;background:#091c25}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 6% 5%,#17685b80 0,transparent 40%),radial-gradient(ellipse at 98% 60%,#244e7780 0,transparent 43%),linear-gradient(145deg,#0b222a,#0b1525);background-attachment:fixed}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:linear-gradient(#b4e6d20d 1px,transparent 1px),linear-gradient(90deg,#b4e6d20d 1px,transparent 1px);background-size:42px 42px}main{position:relative;max-width:920px;margin:auto;padding:32px 18px 80px}.panel{position:relative;overflow:hidden;background:linear-gradient(145deg,#16313bea,#10232fea);border:1px solid #6fa89d40;border-radius:25px;padding:clamp(24px,5vw,46px);box-shadow:0 24px 75px #020b1590}.panel:before{content:'';position:absolute;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,#49d5a4,#50b4bb,#5a91c4)}h1{font-size:clamp(34px,6vw,54px);line-height:1.08;letter-spacing:-.04em;margin:14px 0 18px}h2{font-size:clamp(23px,4vw,35px);line-height:1.23;letter-spacing:-.025em;margin:24px 0}p{line-height:1.65}.muted{color:#b7cfce}.tag{display:inline-flex;align-items:center;background:#55cba31c;border:1px solid #65d4b263;padding:9px 15px;border-radius:99px;color:#b5f2dd;font-size:13px;font-weight:800;letter-spacing:.03em}.options{display:grid;gap:13px;margin:28px 0}.option{display:flex;align-items:center;gap:15px;width:100%;text-align:left;padding:19px 20px;background:#ffffff0b;color:#f0f7f5;border:1.5px solid #80b2ac5c;border-radius:16px;font-size:16px;line-height:1.48;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.option b{flex:none;display:grid;place-items:center;width:38px;height:38px;background:#68cdb52a;border-radius:11px;color:#baf6df}.option:hover:not(:disabled){transform:translateY(-2px);border-color:#72dfb8;background:#6cd7b019}.option:disabled{cursor:default}.option.correct{background:#1d815343;border-color:#67e4aa}.option.wrong{background:#a64d4d35;border-color:#f09b9b}.primary{background:linear-gradient(110deg,#64dbb0,#54b9bf);border:0;color:#092b2e;border-radius:13px;padding:16px 25px;font-size:16px;font-weight:850;cursor:pointer;box-shadow:0 10px 30px #34c8aa2c}.secondary{background:#ffffff0e;border:1px solid #7db6af80;color:#e5f8f3;border-radius:13px;padding:15px 20px;font-size:15px;cursor:pointer}.primary:hover,.secondary:hover{filter:brightness(1.09)}.primary:disabled{opacity:.45;cursor:not-allowed}input{width:100%;font-size:18px;padding:17px;border-radius:13px;border:1.5px solid #6faeaa;background:#091e29;color:white;margin:12px 0 20px}.row{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.feedback{padding:20px;border-radius:15px;background:#ffffff0e;margin:20px 0}.feedback.good{border-left:5px solid #6bdfa8}.feedback.bad{border-left:5px solid #ee9a9a}.progress{height:10px;border-radius:20px;background:#ffffff20;margin:20px 0 30px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#55dba8,#59b9c8);transition:width .25s}.network{max-width:500px;margin:20px auto;background:#0a2430;border:1px solid #70a9a380;border-radius:18px;padding:15px}.network svg{width:100%;display:block}.network line{stroke:#67d9b0;stroke-width:5}.network circle{fill:#286c70;stroke:#a5f4dc;stroke-width:2.5}.network text{fill:white;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.leaderboard{width:100%;border-collapse:collapse;margin:25px 0}.leaderboard td,.leaderboard th{padding:16px 10px;text-align:left;border-bottom:1px solid #86b6ae55}.leaderboard th:last-child,.leaderboard td:last-child{text-align:right}.leaderboard tbody tr:first-child{background:#6ee0ae17}.winner{font-size:clamp(22px,4vw,30px);font-weight:850;color:#8bf1c7}.small{font-size:13px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:25px 0}.stat{padding:18px 12px;border:1px solid #7eb5aa50;background:#ffffff0a;border-radius:16px;text-align:center}.stat strong{display:block;font-size:clamp(21px,4vw,32px);color:#88e9c8}.stat span{font-size:12px;color:#bbd4d0}.eyebrow{color:#8ae9c8;font-weight:850;letter-spacing:.14em;font-size:12px;text-transform:uppercase}.headline-gradient{background:linear-gradient(105deg,#f3fffa,#85e4c4,#80c8de);color:transparent;background-clip:text}.score-pill{display:inline-flex;padding:9px 14px;background:#6bd9b31c;border:1px solid #6bd9b370;border-radius:99px;color:#a4f4d9;font-weight:800}button:focus-visible,input:focus-visible{outline:3px solid #8bf1c7;outline-offset:3px}@media(max-width:550px){.stats{gap:7px}.stat{padding:14px 6px}.option{padding:14px 12px}.option b{width:33px;height:33px}}
</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script></head><body><main><div class="row" style="margin-bottom:20px"><span class="tag">SNA &amp; Ethik Quiz</span><span class="muted" id="headerInfo">9 Fragen · 90 Punkte maximal</span></div><section class="panel" id="screen" aria-live="polite"></section></main><script>
const questions=[
{topic:'Poly · Grundlagen',q:'Wir untersuchen, wer mit wem im Unternehmen zusammenarbeitet. Was sind Knoten und Kanten?',options:['Knoten = Abteilungen; Kanten = Mitarbeitende','Knoten = Mitarbeitende; Kanten = Zusammenarbeitsbeziehungen','Knoten = Beziehungen; Kanten = Mitarbeitende'],correct:1,explanation:'Knoten sind die Mitarbeitenden. Kanten sind die erfassten Zusammenarbeitsbeziehungen zwischen ihnen.'},
{topic:'Poly · Gerichtete und gewichtete Netzwerke',q:'Anna fragt Ben dreimal pro Woche um fachlichen Rat. Wie wird diese Beziehung dargestellt?',options:['Ungerichtet und ungewichtet','Gerichtet und ungewichtet','Gerichtet und gewichtet','Ungerichtet und gewichtet'],correct:2,explanation:'Die Kante verläuft von Anna zu Ben. Ihr Gewicht beträgt 3 Anfragen pro Woche.'},
{topic:'Poly · Netzwerkdichte',q:'Wie hoch ist die Netzwerkdichte in diesem Kooperationsnetzwerk?',hint:'Das Netzwerk ist ungerichtet und ungewichtet.',diagram:true,options:['25 %','50 %','75 %','100 %'],correct:1,explanation:'Das Netzwerk hat 4 Knoten. Maximal möglich sind (4 × 3) / 2 = 6 Kanten. Tatsächlich vorhanden sind 3 Kanten. Die Netzwerkdichte beträgt daher 3 / 6 = 0,5 = 50 %.'},
{topic:'Julia · Microsoft-Studie · Befund 1',q:'Die Zeit mit Kolleginnen und Kollegen aus anderen Teams sank um ein Viertel, während die Vernetzung innerhalb der Teams zunahm. Welches Muster entsteht?',options:['Eine Brücke','Ein Ego-Netzwerk','Ein Silo'],correct:2,explanation:'Ein Silo ist eine Gruppe, die in sich dicht vernetzt ist, aber kaum Verbindungen nach außen hat. Die Dichte innen steigt, die Verbindungen nach außen werden schwächer. Die Forschenden sprechen selbst von Silos.'},
{topic:'Julia · Microsoft-Studie · Befund 2',q:'Mitarbeitende verbrachten rund 40 % weniger Zeit mit Kontakten, die sonst getrennte Teile des Netzwerks verbinden. Welche Kennzahl ist bei solchen Brückenpersonen besonders hoch?',options:['Vermittlungszentralität (Betweenness)','Gradzentralität (Degree)','Nähezentralität (Closeness)'],correct:0,explanation:'Die Vermittlungszentralität misst, wie oft eine Person auf den kürzesten Wegen zwischen anderen liegt. Brückenpersonen sind im Organigramm oft unsichtbar, aber für den Wissensfluss entscheidend.'},
{topic:'Julia · Microsoft-Studie · Befund 3',q:'Der Austausch mit Kolleginnen und Kollegen, mit denen man ohnehin seltener Kontakt hatte, ging um rund ein Drittel zurück. Welche Art von Verbindungen ist zurückgegangen?',options:['Starke Verbindungen','Gerichtete Verbindungen','Formale Verbindungen','Schwache Verbindungen'],correct:3,explanation:'Schwache Verbindungen führen eher in andere Kreise und damit zu neuen Informationen. In der Studie zählt als schwach die Hälfte der Kontakte, mit denen man am wenigsten Zeit verbringt. Starke Verbindungen geben Wissen weiter, schwache bringen oft Neues hinein.'},
{topic:'Lusia · Ethik · Folie 2',q:'Stellt euch vor, Microsoft fragt seine Mitarbeitenden „freiwillig“, ob ihre Kommunikations-Metadaten ausgewertet werden dürfen. Warum reicht ein „Ja, ich stimme zu“ aus ethischer Sicht trotzdem oft nicht aus?',options:['Weil Metadaten immer auch den privaten Textinhalt von E-Mails und Chats offenlegen.','Weil wegen des Machtungleichgewichts zwischen Arbeitgeber und Beschäftigten Druck entstehen kann und die echte Selbstbestimmung eingeschränkt ist.','Weil eine freiwillige Zustimmung automatisch zu weniger Kommunikation im Homeoffice führt.'],correct:1,explanation:'Das Machtungleichgewicht zwischen Arbeitgeber und Beschäftigten kann Druck erzeugen. Deshalb ist eine formal erteilte Zustimmung nicht zwangsläufig wirklich frei.'},
{topic:'Lusia · Mitbestimmung · Folie 3',q:'Praxis-Check: Microsoft Deutschland - Microsoft erfüllt alle DSGVO-Grundsätze (Transparenz, Zweckbindung, Datenminimierung) und möchte die Analyse morgen starten. Warum kann das Projekt in Deutschland trotzdem noch gestoppt werden?',options:['Weil der Betriebsrat ein Mitbestimmungsrecht hat, sobald ein Tool zur Überwachung von Verhalten oder Leistung geeignet ist.','Weil die Speicherbegrenzung vorschreibt, dass Daten erst nach mindestens fünf Jahren ausgewertet werden dürfen.','Weil eine Datenschutz-Folgenabschätzung erst nach Abschluss des Projekts durchgeführt werden darf.'],correct:0,explanation:'Der Betriebsrat hat bei technischen Einrichtungen, die zur Überwachung von Verhalten oder Leistung bestimmt beziehungsweise objektiv geeignet sind, ein Mitbestimmungsrecht (§ 87 Abs. 1 Nr. 6 BetrVG).'},
{topic:'Lusia · Re-Identifikation · Folie 5',q:'Wir haben zuvor gesehen, dass Person 4 trotz Nummer sofort erkennbar ist (Re-Identifikation). Ein Analyst sagt: „Dann fassen wir die Daten einfach auf Gruppenebene zusammen (Aggregation)!“ Wann funktioniert selbst das nicht mehr?',options:['Wenn die Gruppen sehr klein sind (z. B. nur 2–3 Personen), weil dann trotzdem Rückschlüsse auf Einzelne möglich sind.','Wenn die Daten nur für das ursprüngliche Ziel verwendet werden (Zweckbindung).','Wenn die Mitarbeitenden vorher transparent über die Analyse informiert wurden (Transparenz).'],correct:0,explanation:'Auch aggregierte Daten können Rückschlüsse auf einzelne Personen zulassen, wenn die Gruppen sehr klein sind.'}
];
// Firebase-Projekt Quiz. Falls die Verbindung nicht klappt: apiKey in Firebase > Projekteinstellungen > Meine Apps vergleichen.
const FIREBASE_CONFIG = {
 apiKey: "AIzaSyBzc6v2ktzTq4Br9tJi-mQy3QpxKtBOjgI",
 authDomain: "quiz-a0462.firebaseapp.com",
 databaseURL: "https://quiz-a0462-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "quiz-a0462",
 storageBucket: "quiz-a0462.firebasestorage.app",
 messagingSenderId: "201106962932",
 appId: "1:201106962932:web:894fdb5ea78ad113ad21a1"
};
const STORAGE_KEY='sna-ethik-quiz-v2';
const screen=document.getElementById('screen');
let players=[],current=null,index=0,score=0,answered=false,choiceMade=null,finished=false,uid=null,database=null,ready=false;
const stored=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){return null}};
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({current,index,score,choiceMade,finished}));}
function restore(){const s=stored();if(s&&s.current){current=s.current;index=Math.min(Math.max(0,s.index||0),questions.length);score=s.score||0;choiceMade=s.choiceMade===null||s.choiceMade===undefined?null:s.choiceMade;finished=!!s.finished;return true}return false}
function errorMessage(e){alert('Firebase-Fehler: '+(e?.message||e)+'. Bitte prüfe deine Firebase-Einstellungen.');}
function boot(){
 screen.innerHTML='<h1>Quiz wird verbunden …</h1><p class="muted">Bitte kurz warten.</p>';
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  database=firebase.database();
  firebase.auth().signInAnonymously().then(user=>{
   uid=user.user.uid;ready=true;
   database.ref('scores').on('value',snap=>{players=Object.values(snap.val()||{});if(document.getElementById('rankingTable'))showRanking();},errorMessage);
   if(restore()) {if(finished)showRanking();else if(index>=questions.length)finish();else showQuestion();} else home();
  }).catch(errorMessage);
 }catch(e){errorMessage(e)}
}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function network(){return `<div class="network" role="img" aria-label="Vier Personen. Genau drei ungerichtete Verbindungen: Anna mit Ben, Ben mit Clara, Ben mit Dennis."><svg viewBox="0 0 440 270" xmlns="http://www.w3.org/2000/svg"><line x1="220" y1="132" x2="85" y2="55"/><line x1="220" y1="132" x2="355" y2="55"/><line x1="220" y1="132" x2="220" y2="230"/><circle cx="85" cy="55" r="35"/><circle cx="355" cy="55" r="35"/><circle cx="220" cy="132" r="35"/><circle cx="220" cy="230" r="35"/><text x="85" y="55">Anna</text><text x="355" y="55">Clara</text><text x="220" y="132">Ben</text><text x="220" y="230">Dennis</text></svg></div>`}
function home(){
 document.getElementById('headerInfo').textContent='9 Fragen · 90 Punkte maximal';
 screen.innerHTML=`<div class="eyebrow">Wissen überprüfen · Punkte sammeln</div><h1><span class="headline-gradient">SNA & Ethik Quiz</span></h1><p class="muted">9 Fragen während eurer Präsentation. Nach jeder Frage wartet ihr auf das Signal zum Weiterklicken.</p><div class="stats"><div class="stat"><strong>9</strong><span>Quizfragen</span></div><div class="stat"><strong>+10</strong><span>pro richtiger Antwort</span></div><div class="stat"><strong>90</strong><span>Punkte maximal</span></div></div><label for="name"><b>Name oder Nickname</b></label><input id="name" maxlength="30" placeholder="Dein Name" autocomplete="off"><button class="primary" id="start">Quiz starten</button><p class="muted small">Bitte pro Person nur einmal teilnehmen. Schließt du die Seite, kannst du auf demselben Gerät fortsetzen.</p>`;
 document.getElementById('start').onclick=()=>{
  const name=document.getElementById('name').value.trim();if(!name)return alert('Bitte einen Namen eingeben.');
  if(players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return alert('Dieser Name ist bereits in der Rangliste. Bitte einen anderen Nickname wählen.');
  current=name;index=0;score=0;choiceMade=null;finished=false;save();showQuestion();
 };
 document.getElementById('name').onkeydown=e=>{if(e.key==='Enter')document.getElementById('start').click()};
}
function showQuestion(){
 if(index>=questions.length){finish();return}
 const q=questions[index];answered=choiceMade!==null;
 document.getElementById('headerInfo').textContent=`${current} · ${score} Punkte`;
 screen.innerHTML=`<div class="row"><span class="tag">${escapeHTML(q.topic)}</span><span class="score-pill">${score} / 90 Punkte</span></div><p class="muted small">Frage ${index+1} von ${questions.length} · 10 Punkte möglich</p><div class="progress"><div style="width:${index/questions.length*100}%"></div></div><h2>${escapeHTML(q.q)}</h2>${q.hint?`<p class="muted">Hinweis: ${escapeHTML(q.hint)}</p>`:''}${q.diagram?network():''}<div class="options">${q.options.map((o,i)=>`<button class="option" data-i="${i}"><b>${'ABCD'[i]}</b><span>${escapeHTML(o)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button class="primary hidden" id="next">${index===questions.length-1?'Ergebnis und Rangliste anzeigen':'Nächste Frage →'}</button>`;
 screen.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)));
 document.getElementById('next').onclick=()=>{if(choiceMade===null)return;index++;choiceMade=null;save();if(index<questions.length)showQuestion();else finish()};
 if(answered)renderFeedback();
}
function renderFeedback(){
 const q=questions[index],right=choiceMade===q.correct;
 screen.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===choiceMade)b.classList.add('wrong')});
 document.getElementById('feedback').innerHTML=`<div class="feedback ${right?'good':'bad'}"><b>${right?'✓ Richtig! +10 Punkte':'✗ Leider falsch.'}</b><p>Richtige Antwort: <b>${'ABCD'[q.correct]}) ${escapeHTML(q.options[q.correct])}</b></p><p>${escapeHTML(q.explanation)}</p><p class="muted small">Dein Punktestand: ${score} / 90 Punkten</p><p><b>Warte auf das Signal der Präsentierenden.</b> Klicke erst dann auf „Nächste Frage“.</p></div>`;
 document.getElementById('next').classList.remove('hidden');
}
function answer(choice){if(answered)return;answered=true;choiceMade=choice;if(choice===questions[index].correct)score+=10;save();renderFeedback();}
async function finish(){
 index=questions.length;save();
 screen.innerHTML='<h2>Ergebnis wird gespeichert …</h2><p class="muted">Bitte kurz warten.</p>';
 try{
  const ref=database.ref('scores/'+uid);
  const result=await ref.transaction(existing=>existing===null?{name:current,score}:undefined,undefined,false);
  if(!result.committed){alert('Für dieses Gerät existiert bereits ein Ergebnis in der Rangliste. Es wurde kein zweiter Eintrag angelegt.');}
  finished=true;save();showRanking();
 }catch(e){errorMessage(e);screen.innerHTML='<h2>Speichern fehlgeschlagen</h2><p>Bitte Internetverbindung prüfen und erneut versuchen.</p><button class="primary" id="retry">Erneut speichern</button>';document.getElementById('retry').onclick=finish;}
}
function showRanking(){
 const sorted=[...players].sort((a,b)=>b.score-a.score);
 document.getElementById('headerInfo').textContent=`${players.length} Teilnehmende`;
 const winners=sorted.filter(p=>p.score===sorted[0]?.score);
 screen.innerHTML=`<span class="tag">🏆 Endstand</span><h1>Gemeinsame Rangliste</h1><p class="winner">${winners.length?`🏆 ${winners.map(p=>escapeHTML(p.name)).join(' & ')} ${winners.length===1?'gewinnt!':'gewinnen gemeinsam!'}`:'Noch keine Ergebnisse'}</p><p class="muted">Die Liste aktualisiert sich automatisch, wenn weitere Personen fertig sind.</p><table id="rankingTable" class="leaderboard"><thead><tr><th>Platz</th><th>Name</th><th>Punkte</th></tr></thead><tbody>${sorted.map(p=>{const rank=1+sorted.filter(x=>x.score>p.score).length;return `<tr><td>${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank+'.'}</td><td>${escapeHTML(p.name)}</td><td><b>${p.score} / 90</b></td></tr>`}).join('')}</tbody></table><p class="muted small">Test-Ergebnisse kann die Veranstalterin in Firebase unter Realtime Database → Daten → scores löschen. Nicht auf einem fremden Gerät zurücksetzen.</p>`;
}
boot();
</script></body></html>
